<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7fa" />
  <title>Nia Hernández | Lo Mejor de Todo</title>

  <style>
    :root{
      --rosa:#ef5f86;
      --rosa2:#ff8ca8;
      --fondo:#fff7fa;
      --texto:#262126;
      --suave:#766d73;
      --linea:#f0dce3;
      --blanco:#ffffff;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      background:var(--fondo);
      color:var(--texto);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    body{overflow-x:hidden}

    .app{
      width:100%;
      max-width:680px;
      min-height:100vh;
      margin:0 auto;
      background:var(--blanco);
      box-shadow:0 0 35px rgba(80,30,50,.08);
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      height:54px;
      padding-top:env(safe-area-inset-top);
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--linea);
      font-weight:800;
      letter-spacing:.2px;
    }

    .profile{
      padding:22px 18px 16px;
      background:linear-gradient(180deg,#fff 0%,#fff8fb 100%);
    }

    .profile-main{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .avatar-wrap{
      flex:0 0 auto;
      width:92px;
      height:92px;
      padding:3px;
      border-radius:50%;
      background:linear-gradient(135deg,#ffafc3,#ef5f86,#ffc5d2);
    }

    .avatar{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      border-radius:50%;
      border:3px solid #fff;
      background:#f5e8ed;
    }

    .profile-info{min-width:0}

    .name-line{
      display:flex;
      align-items:center;
      gap:6px;
      margin-bottom:5px;
    }

    .name{
      margin:0;
      font-size:24px;
      line-height:1.15;
      font-weight:800;
    }

    .verified{
      display:inline-grid;
      place-items:center;
      width:19px;
      height:19px;
      border-radius:50%;
      background:#2196f3;
      color:#fff;
      font-size:13px;
      font-weight:900;
      line-height:1;
    }

    .username{
      margin:0;
      font-size:14px;
      color:var(--suave);
      font-weight:600;
    }

    .bio{
      margin:17px 0 13px;
      font-size:15px;
      line-height:1.45;
    }

    .buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .btn{
      border:0;
      border-radius:12px;
      padding:12px 10px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      text-align:center;
      text-decoration:none;
      transition:transform .15s ease,opacity .15s ease;
    }

    .btn:active{transform:scale(.98)}

    .btn-primary{
      color:#fff;
      background:linear-gradient(135deg,var(--rosa),var(--rosa2));
    }

    .btn-secondary{
      color:#9e3454;
      background:#ffe8ef;
      border:1px solid #ffd2df;
    }

    .btn-channel{
      grid-column:1/-1;
      color:#fff;
      background:#2f2a2d;
    }

    .tabs{
      display:grid;
      place-items:center;
      height:46px;
      border-top:1px solid var(--linea);
      border-bottom:1px solid var(--linea);
      background:#fff;
    }

    .grid-icon{
      width:21px;
      height:21px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:2px;
    }

    .grid-icon span{
      background:#2d292c;
      border-radius:1px;
    }

    .reels-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:2px;
      background:#fff;
      padding-bottom:calc(8px + env(safe-area-inset-bottom));
    }

    .thumb{
      position:relative;
      width:100%;
      aspect-ratio:3/4;
      overflow:hidden;
      background:#eadfe3;
      border:0;
      padding:0;
      cursor:pointer;
    }

    .thumb video{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      pointer-events:none;
    }

    .play-mark{
      position:absolute;
      top:8px;
      right:8px;
      width:22px;
      height:22px;
      display:grid;
      place-items:center;
      border-radius:50%;
      color:#fff;
      background:rgba(0,0,0,.45);
      font-size:11px;
      backdrop-filter:blur(5px);
    }

    .viewer{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      background:#000;
      overflow:hidden;
    }

    .viewer.open{display:block}

    .viewer-close{
      position:fixed;
      top:calc(13px + env(safe-area-inset-top));
      left:14px;
      z-index:130;
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:50%;
      color:#fff;
      background:rgba(0,0,0,.42);
      font-size:28px;
      cursor:pointer;
      backdrop-filter:blur(8px);
    }

    .slides{
      width:100%;
      height:100%;
      overflow-y:auto;
      scroll-snap-type:y mandatory;
      overscroll-behavior-y:contain;
      scrollbar-width:none;
    }

    .slides::-webkit-scrollbar{display:none}

    .slide{
      position:relative;
      width:100%;
      height:100dvh;
      min-height:100vh;
      scroll-snap-align:start;
      scroll-snap-stop:always;
      background:#000;
    }

    .slide video{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      background:#000;
    }

    .shade{
      position:absolute;
      inset:auto 0 0;
      height:43%;
      pointer-events:none;
      background:linear-gradient(transparent,rgba(0,0,0,.78));
    }

    .caption{
      position:absolute;
      left:18px;
      right:90px;
      bottom:calc(26px + env(safe-area-inset-bottom));
      z-index:3;
      color:#fff;
      text-shadow:0 1px 6px rgba(0,0,0,.6);
    }

    .caption-name{
      display:flex;
      align-items:center;
      gap:6px;
      margin-bottom:7px;
      font-weight:850;
      font-size:17px;
    }

    .caption .verified{
      width:17px;
      height:17px;
      font-size:11px;
    }

    .caption-text{
      margin:0;
      font-size:15px;
      line-height:1.35;
    }

    .actions{
      position:absolute;
      right:14px;
      bottom:calc(30px + env(safe-area-inset-bottom));
      z-index:5;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .action{
      width:54px;
      height:54px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:50%;
      color:#fff;
      background:rgba(25,19,22,.62);
      box-shadow:0 4px 18px rgba(0,0,0,.22);
      backdrop-filter:blur(10px);
      cursor:pointer;
    }

    .action svg{
      width:29px;
      height:29px;
      fill:none;
      stroke:currentColor;
      stroke-width:2.25;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .action:active{transform:scale(.93)}

    @media (min-width:700px){
      .viewer{
        left:50%;
        width:430px;
        transform:translateX(-50%);
        box-shadow:0 0 50px rgba(0,0,0,.5);
      }
      .viewer-close{left:calc(50% - 201px)}
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">Nia Hernández</header>

    <section class="profile">
      <div class="profile-main">
        <div class="avatar-wrap">
          <img class="avatar" src="profile.jpg" alt="Foto de Nia Hernández">
        </div>

        <div class="profile-info">
          <div class="name-line">
            <h1 class="name">Nia Hernández</h1>
            <span class="verified" aria-label="Verificada">✓</span>
          </div>
          <p class="username">@niahernandez1</p>
        </div>
      </div>

      <p class="bio">Mis momentos y un poquito más de mí 💕</p>

      <div class="buttons">
        <a class="btn btn-primary" href="tg://resolve?domain=niahernandez1">Comprar contenido</a>
        <a class="btn btn-secondary" href="tg://resolve?domain=niahernandez1">Escribirme</a>
        <a class="btn btn-channel" href="tg://resolve?domain=esthefania_hernand">Ver canal de Telegram</a>
      </div>
    </section>

    <div class="tabs" aria-hidden="true">
      <div class="grid-icon">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
    </div>

    <section id="reelsGrid" class="reels-grid" aria-label="Publicaciones de Nia Hernández"></section>
  </main>

  <section id="viewer" class="viewer" aria-hidden="true">
    <button id="closeViewer" class="viewer-close" aria-label="Cerrar">×</button>
    <div id="slides" class="slides"></div>
  </section>

  <script>
    const CHAT_LINK = "https://t.me/niahernandez1";
    const CHANNEL_LINK = "https://t.me/esthefania_hernand";

    const reels = [
      "reel00001.mp4",
      "reel00002.mp4",
      "reel00003.mp4",
      "reel00004.mp4",
      "reel00005.mp4",
      "reel00006.mp4",
      "reel00007.mp4",
      "reel00008.mp4",
      "reel00009.mp4",
      "reel00010.mp4",
      "reel00011.mp4",
      "reel00012.mp4",
      "reel00013.mp4",
      "reel00014.mp4",
      "reel00015.mp4",
      "reel00016.mp4",
      "reel00017.mp4",
      "reel00018.mp4",
      "reel00019.mp4",
      "reel00020.mp4",
      "reel00021.mp4"
    ];

    const captions = [
      "Hoy vine a dejarte pensando en mí 💕",
      "Un poquito de mi día para ti ✨",
      "Desliza, pero no te vayas tan rápido 😘",
      "Mi energía favorita siempre aparece aquí 💗",
      "Este momento no quería guardarlo sola 👀",
      "¿Cuál ha sido tu reel favorito hasta ahora? 💕",
      "Me encanta cuando te quedas a mirar ✨",
      "Hoy estoy de buen humor y se nota 😘",
      "Otro pedacito de mí para ti 💗",
      "Sigue deslizando, todavía falta lo mejor 👀",
      "Aquí siempre encontrarás algo nuevo 💕",
      "Este reel tiene algo especial ✨",
      "No sabía si subirlo… pero aquí está 😘",
      "Un momento bonito que quería compartir 💗",
      "Mírame bien, que este te va a gustar 👀",
      "Hoy quería aparecer por aquí 💕",
      "A veces un reel dice más que mil palabras ✨",
      "Este quedó entre mis favoritos 😘",
      "No te vayas todavía, falta poquito 💗",
      "Casi llegas al final… sigue mirando 👀",
      "Llegaste al último… ahora escríbeme 💕"
    ];

    const grid = document.getElementById("reelsGrid");
    const viewer = document.getElementById("viewer");
    const slides = document.getElementById("slides");
    const closeViewer = document.getElementById("closeViewer");

    function goTo(link){
      window.location.href = link;
    }

    function heartIcon(){
      return `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0L12 5.8l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21.3l7.8-7.7 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
        </svg>`;
    }

    function messageIcon(){
      return `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-3.8-.8L3 21l1.8-4.8a8.2 8.2 0 1 1 16.2-4.7Z"/>
          <path d="M8.1 11.8h.01M12 11.8h.01M15.9 11.8h.01"/>
        </svg>`;
    }

    function shareIcon(){
      return `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m22 2-7 20-4-9-9-4 20-7Z"/>
          <path d="M22 2 11 13"/>
        </svg>`;
    }

    function prepareThumbnail(video){
      video.muted = true;
      video.playsInline = true;
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.preload = "auto";

      let frameReady = false;

      const showFirstFrame = () => {
        if (frameReady || !Number.isFinite(video.duration) || video.duration <= 0) return;
        frameReady = true;
        const moment = Math.min(0.35, Math.max(0.08, video.duration * 0.02));
        try { video.currentTime = moment; } catch (_) {}
      };

      video.addEventListener("loadedmetadata", showFirstFrame, { once:true });
      video.addEventListener("loadeddata", showFirstFrame, { once:true });
      video.addEventListener("seeked", () => video.pause(), { once:true });
      video.load();
    }

    function createGrid(){
      reels.forEach((src,index)=>{
        const button = document.createElement("button");
        button.className = "thumb";
        button.type = "button";
        button.setAttribute("aria-label", `Abrir publicación ${index + 1}`);

        const video = document.createElement("video");
        video.src = src;
        video.setAttribute("aria-hidden", "true");

        const play = document.createElement("span");
        play.className = "play-mark";
        play.textContent = "▶";

        button.appendChild(video);
        button.appendChild(play);
        prepareThumbnail(video);

        button.addEventListener("click",()=>openViewer(index));
        grid.appendChild(button);
      });
    }

    function createSlides(){
      reels.forEach((src,index)=>{
        const slide = document.createElement("article");
        slide.className = "slide";
        slide.dataset.index = index;

        slide.innerHTML = `
          <video src="${src}" playsinline loop preload="metadata"></video>
          <div class="shade"></div>

          <div class="caption">
            <div class="caption-name">
              <span>@niahernandez1</span>
              <span class="verified" aria-label="Verificada">✓</span>
            </div>
            <p class="caption-text">${captions[index]}</p>
          </div>

          <div class="actions">
            <button class="action channel-action" type="button" aria-label="Abrir canal">
              ${heartIcon()}
            </button>

            <button class="action chat-action" type="button" aria-label="Enviar mensaje">
              ${messageIcon()}
            </button>

            <button class="action channel-action" type="button" aria-label="Compartir y abrir canal">
              ${shareIcon()}
            </button>
          </div>
        `;

        slide.querySelectorAll(".channel-action").forEach(btn=>{
          btn.addEventListener("click",(event)=>{
            event.stopPropagation();
            goTo(CHANNEL_LINK);
          });
        });

        slide.querySelector(".chat-action").addEventListener("click",(event)=>{
          event.stopPropagation();
          goTo(CHAT_LINK);
        });

        slide.addEventListener("click",(event)=>{
          if(event.target.closest("button")) return;
          const video = slide.querySelector("video");
          if(video.paused){
            video.play().catch(()=>{});
          }else{
            video.pause();
          }
        });

        slides.appendChild(slide);
      });
    }

    function pauseAll(){
      document.querySelectorAll(".slide video").forEach(video=>{
        video.pause();
      });
    }

    function playVisibleSlide(){
      if(!viewer.classList.contains("open")) return;

      const index = Math.round(slides.scrollTop / slides.clientHeight);
      pauseAll();

      const activeVideo = document.querySelector(`.slide[data-index="${index}"] video`);
      if(activeVideo){
        activeVideo.muted = false;
        activeVideo.volume = 1;
        activeVideo.play().catch(()=>{
          activeVideo.muted = true;
          activeVideo.play().catch(()=>{});
        });
      }
    }

    function openViewer(index){
      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden","false");
      document.body.style.overflow = "hidden";

      requestAnimationFrame(()=>{
        slides.scrollTo({
          top:index * slides.clientHeight,
          behavior:"instant"
        });
        setTimeout(playVisibleSlide,80);
      });
    }

    function closeModal(){
      pauseAll();
      viewer.classList.remove("open");
      viewer.setAttribute("aria-hidden","true");
      document.body.style.overflow = "";
    }

    let scrollTimer;
    slides.addEventListener("scroll",()=>{
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(playVisibleSlide,100);
    },{passive:true});

    closeViewer.addEventListener("click",closeModal);

    document.addEventListener("keydown",(event)=>{
      if(event.key === "Escape") closeModal();
    });

    createGrid();
    createSlides();
  </script>
</body>
</html>
